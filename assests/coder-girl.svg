<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#15171a"/><stop offset="1" stop-color="#23262b"/></linearGradient>
<style>
.l{fill:#9aa1ad;animation:ty 3.2s ease-in-out infinite}
.l2{animation-delay:.5s}.l3{animation-delay:1s}.l4{animation-delay:1.5s}.l5{animation-delay:2s}
@keyframes ty{0%,100%{opacity:.25}50%{opacity:1}}
.b{transform-box:fill-box;transform-origin:50% 100%;animation:gr 2.6s ease-in-out infinite}
.b2{animation-delay:.4s}.b3{animation-delay:.8s}.b4{animation-delay:1.2s}
@keyframes gr{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
.cl{animation:fl 4s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.cur{animation:bl 1s step-end infinite}@keyframes bl{50%{opacity:0}}
.rg{stroke-dasharray:100 100;animation:rg 4s ease-in-out infinite}@keyframes rg{0%,100%{stroke-dasharray:35 165}50%{stroke-dasharray:120 80}}
.sg{animation:gl 3s ease-in-out infinite}@keyframes gl{0%,100%{opacity:.5}50%{opacity:1}}
</style></defs>
<rect width="480" height="360" rx="18" fill="url(#bg)"/>
<!-- floating cloud -->
<g class="cl" fill="#e4e7ec" opacity=".85"><circle cx="395" cy="48" r="13"/><circle cx="412" cy="42" r="17"/><circle cx="430" cy="50" r="12"/><rect x="392" y="48" width="48" height="14" rx="7"/></g>
<g fill="#6b7280" opacity=".7"><circle cx="60" cy="52" r="2"/><circle cx="110" cy="30" r="1.6"/><circle cx="300" cy="36" r="1.8"/><circle cx="350" cy="70" r="1.4"/></g>
