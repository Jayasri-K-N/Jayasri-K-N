<rect x="30" y="270" width="420" height="16" rx="4" fill="#3a3d42"/>
<rect x="50" y="286" width="10" height="64" fill="#2b2e33"/><rect x="420" y="286" width="10" height="64" fill="#2b2e33"/>
<!-- left monitor -->
<rect x="140" y="226" width="16" height="30" fill="#2b2e33"/><rect x="112" y="254" width="72" height="8" rx="3" fill="#2b2e33"/>
<rect x="60" y="96" width="190" height="132" rx="9" fill="#1b1d21" stroke="#4b5563" stroke-width="2"/>
<rect x="69" y="105" width="172" height="114" rx="4" fill="#0e0f11"/>
<g><rect class="l" x="80" y="118" width="70" height="6" rx="3"/><rect class="l l2" x="92" y="134" width="110" height="6" rx="3"/><rect class="l l3" x="92" y="150" width="86" height="6" rx="3"/><rect class="l l4" x="80" y="166" width="126" height="6" rx="3"/><rect class="l l5" x="92" y="182" width="60" height="6" rx="3"/><rect class="cur" x="158" y="181" width="6" height="9" fill="#fff"/></g>
<!-- right monitor -->
<rect x="324" y="226" width="16" height="30" fill="#2b2e33"/><rect x="296" y="254" width="72" height="8" rx="3" fill="#2b2e33"/>
<rect x="230" y="96" width="190" height="132" rx="9" fill="#1b1d21" stroke="#4b5563" stroke-width="2"/>
<rect x="239" y="105" width="172" height="114" rx="4" fill="#0e0f11"/>
<g class="sg"><circle cx="285" cy="145" r="26" fill="none" stroke="#3a3d42" stroke-width="9"/><circle class="rg" cx="285" cy="145" r="26" fill="none" stroke="#e4e7ec" stroke-width="9" pathLength="200" transform="rotate(-90 285 145)"/></g>
<g fill="#c3c8d0"><rect class="b" x="334" y="120" width="12" height="70" rx="2"/><rect class="b b2" x="352" y="140" width="12" height="50" rx="2" fill="#8b9098"/><rect class="b b3" x="370" y="108" width="12" height="82" rx="2"/><rect class="b b4" x="388" y="150" width="12" height="40" rx="2" fill="#8b9098"/></g>
<rect x="255" y="196" width="146" height="5" rx="2.5" fill="#3a3d42"/><rect x="255" y="196" width="92" height="5" rx="2.5" fill="#e4e7ec"/>
